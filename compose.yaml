name: local-video-search

x-app: &app
  image: local-video-search:dev
  build:
    context: .
    target: vision
  environment: &environment
    DATABASE_URL: postgresql://video:video-local@db:5432/video
    MEDIA_ROOT: /media
    LIBRARY_ID: ${VIDEO_DIRECTORY:?Set VIDEO_DIRECTORY to an absolute existing directory in .env}
    MODEL_CACHE: /models
    QWEN_BASE_URL: ${QWEN_BASE_URL:-}
    QWEN_API_KEY: ${QWEN_API_KEY:-}
    VISION_PROVIDER: ${VISION_PROVIDER:-qwen}
    VOYAGER_BASE_URL: ${VOYAGER_BASE_URL:-https://openai.rc.asu.edu/v1}
    VOYAGER_API_KEY: ${VOYAGER_API_KEY:-}
    UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-2147483648}
    UPLOAD_READ_ROOT: /uploaded-media
  volumes:
    - models:/models
    - type: bind
      source: ${VIDEO_DIRECTORY:?Set VIDEO_DIRECTORY to an absolute existing directory in .env}
      target: /media
      read_only: true
      bind:
        create_host_path: false
    - uploads:/uploaded-media:ro
  depends_on:
    db:
      condition: service_healthy
  init: true

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    # Bounded memory; pgvector stays within a 2 GiB working set for a personal library.
    mem_limit: 2g
    environment:
      POSTGRES_USER: video
      POSTGRES_PASSWORD: video-local
      POSTGRES_DB: video
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U video -d video"]
      interval: 2s
      timeout: 5s
      retries: 20
  api:
    <<: *app
    environment:
      <<: *environment
      UPLOAD_WRITE_ROOT: /uploads
    volumes:
      - models:/models
      - type: bind
        source: ${VIDEO_DIRECTORY:?Set VIDEO_DIRECTORY to an absolute existing directory in .env}
        target: /media
        read_only: true
        bind:
          create_host_path: false
      - uploads:/uploaded-media:ro
      - uploads:/uploads
    ports:
      - "127.0.0.1:8000:8000"
    # Query-time SigLIP + text encoder + optional reranker fit in 3 GiB.
    mem_limit: 3g
    # Immutable root filesystem; frames and probe scratch go to the tmpfs /tmp below.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=1g
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
  worker:
    <<: *app
    command: [python, -m, video_search.worker]
    restart: "on-failure:3"
    # Indexing loads SigLIP + text encoder + Whisper and buffers a 16 kHz wav; 4 GiB.
    mem_limit: 4g
    # SIGTERM finishes the current job; ffmpeg audio extraction alone can run 600 s.
    # A killed job resumes from its remaining windows after the 60 s lease expires.
    stop_grace_period: 10m
    # Immutable root filesystem; frame sampling and wav scratch go to the tmpfs /tmp below.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=1g
  test-db:
    profiles: [test]
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-local
      POSTGRES_DB: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U test -d test"]
      interval: 2s
      timeout: 5s
      retries: 20
  test:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql://test:test-local@test-db:5432/test
      MODEL_CACHE: /models
      RUN_MODEL_TESTS: ${RUN_MODEL_TESTS:-0}
    volumes:
      - models:/models:ro
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  database:
  models:
  uploads:
